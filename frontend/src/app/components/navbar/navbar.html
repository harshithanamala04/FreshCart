<header class="navbar-header">

  <nav class="navbar-main">
    <div class="container navbar-container">
      
      <!-- Brand Logo -->
      <div class="brand-block" (click)="cartService.activeCategory.set('all'); cartService.searchQuery.set('')" title="FreshCart - Home">
        <img 
          src="/logo.jpg" 
          alt="FreshCart Logo" 
          class="brand-logo-img h-10 md:h-12 w-auto object-contain"
          width="130"
          height="48"
          (error)="handleLogoError($event)"
        />
      </div>

      <!-- Search Bar -->
      <div class="search-container">
        <div class="search-input-wrapper">
          <input 
            type="text" 
            class="search-input" 
            placeholder="Search fresh fruits, leafy greens, veggies..."
            [value]="cartService.searchQuery()"
            (input)="onSearchChange($event)"
            aria-label="Search fresh produce catalog"
          />
          @if (cartService.searchQuery()) {
            <button class="search-clear-btn" (click)="clearSearch()" type="button" title="Clear search" aria-label="Clear search">✕</button>
          }
        </div>
      </div>

      <!-- Actions Group: Auth & Basket Trigger -->
      <div class="navbar-actions">
        <!-- Auth Controls -->
        @if (!authService.isLoggedIn()) {
          <button class="btn-signin" (click)="authService.openAuthModal()" type="button" aria-label="Sign In or Register">
            <svg class="user-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Sign In / Register</span>
          </button>
        } @else {
          <div class="user-badge-group">
            <div class="user-chip" [class.admin-user]="authService.isAdmin()" title="Logged in as {{ authService.currentUser()?.username }}">
              <span class="user-avatar-initial" [class.admin-avatar]="authService.isAdmin()">
                {{ (authService.currentUser()?.username || 'U')[0].toUpperCase() }}
              </span>
              <span class="user-name">{{ authService.currentUser()?.username }}</span>
              @if (authService.isAdmin()) {
                <span class="admin-tag-pill">Admin</span>
              }
            </div>
            <button class="btn-logout" (click)="authService.logout()" type="button" title="Sign Out">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
              </svg>
              <span>Logout</span>
            </button>
          </div>
        }

        <!-- Farm Admin Portal Link (Only visible to verified Administrators) -->
        @if (authService.isAdmin()) {
          <button type="button" class="btn-farm-admin" (click)="goToAdmin()" title="Open Farm Manager Admin Portal">
            <span class="admin-leaf-icon">🌾</span>
            <span>Farm Admin</span>
          </button>
        }

        <!-- Basket Trigger Button (Only visible once the user logs in) -->
        @if (authService.isLoggedIn()) {
          <div class="cart-trigger-block">
            <button class="basket-btn" (click)="cartService.openCart()" type="button" aria-label="Open Cart Basket">
              <div class="basket-icon-box">
                <svg class="basket-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
                  <line x1="3" y1="6" x2="21" y2="6"/>
                  <path d="M16 10a4 4 0 0 1-8 0"/>
                </svg>
                @if (cartService.totalItemCount() > 0) {
                  <span class="basket-count-badge">{{ cartService.totalItemCount() }}</span>
                }
              </div>
              <div class="basket-text-group">
                <span class="basket-label">My Basket</span>
                <span class="basket-amount">₹{{ cartService.subtotal() }}</span>
              </div>
            </button>
          </div>
        }
      </div>

    </div>
  </nav>
</header>
